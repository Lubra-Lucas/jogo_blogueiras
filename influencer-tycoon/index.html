<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2a1238" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Influencer Tycoon</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #2a1238; --panel: #3d1b52; --line: #ff7eb6; --text: #fff4fb;
      --muted: #c9a3d9; --gold: #ffd36e; --ok: #7dffb3;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font: 10px/1.6 'Press Start 2P', monospace;
      touch-action: manipulation; user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      display: flex; flex-direction: column;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    header { text-align: center; padding: 12px 16px 4px; }
    #followers { font-size: 22px; color: var(--gold); text-shadow: 3px 3px 0 #000; word-break: break-all; }
    #rates { color: var(--muted); margin-top: 6px; }
    #title { display: inline-block; margin-top: 8px; padding: 4px 8px; border: 2px solid var(--line); color: var(--line); }

    main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #stage { position: relative; display: grid; place-items: center; padding: 8px; }
    #star {
      background: none; border: 0; padding: 0; cursor: pointer;
      width: min(56vw, 34vh, 280px); aspect-ratio: 16 / 20;
      transition: transform 60ms;
    }
    #star:active { transform: scale(0.92, 0.88); }
    #star:focus-visible { outline: 3px dashed var(--gold); outline-offset: 6px; }
    canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
    #hint { color: var(--muted); margin: 4px 0 0; }

    .pop { position: absolute; pointer-events: none; color: var(--text); text-shadow: 2px 2px 0 #000;
           animation: up 0.9s ease-out forwards; }
    .pop.viral { color: var(--gold); font-size: 14px; }
    @keyframes up { to { transform: translateY(-80px); opacity: 0; } }

    #shop { flex: 1; min-height: 0; overflow-y: auto; padding: 0 12px 16px; -webkit-overflow-scrolling: touch; }
    #shop h2 { font-size: 10px; color: var(--line); margin: 14px 4px 8px; }
    .item {
      width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; text-align: left;
      background: var(--panel); color: var(--text); font: inherit;
      border: 3px solid #000; box-shadow: inset -3px -3px 0 rgba(0,0,0,.35), inset 3px 3px 0 rgba(255,255,255,.12);
      padding: 10px; margin-bottom: 8px; cursor: pointer;
    }
    .item:disabled { opacity: 0.45; cursor: default; }
    .item:not(:disabled):active { transform: translateY(2px); }
    .item small { grid-column: 1; color: var(--muted); font-size: 8px; }
    .item .count { color: var(--gold); text-align: right; }
    .item .price { color: var(--ok); text-align: right; font-size: 8px; }

    #toast {
      position: fixed; left: 50%; top: 20%; transform: translateX(-50%); width: min(90vw, 360px);
      background: var(--panel); border: 3px solid var(--line); padding: 14px; text-align: center; z-index: 2;
    }
    #toast button { margin-top: 10px; font: inherit; background: var(--line); color: #000; border: 3px solid #000; padding: 8px 12px; }

    @media (min-width: 820px) {
      body { font-size: 12px; }
      main { flex-direction: row; max-width: 1100px; width: 100%; margin: 0 auto; }
      #stage { flex: 1; }
      #star { width: min(40vw, 60vh, 380px); }
      #shop { flex: 0 0 420px; }
    }
  </style>
</head>
<body>
  <header>
    <div id="followers">0</div>
    <div id="rates"></div>
    <div id="title"></div>
  </header>
  <main>
    <section id="stage">
      <button id="star" aria-label="Postar: ganhar seguidores"><canvas width="16" height="20"></canvas></button>
      <p id="hint">toque pra postar</p>
    </section>
    <section id="shop" aria-label="Loja"></section>
  </main>
  <div id="toast" hidden><p id="toast-text"></p><button type="button">Arrasou</button></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
